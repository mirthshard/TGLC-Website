    <script>
      // Defensive protection against browser extensions (e.g. Phantom, MetaMask, evmAsk)
      // that attempt non-configurable Object.defineProperty collisions on window.ethereum
      (function() {
        try {
          const originalDefine = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && (prop === 'ethereum' || prop === 'solana')) {
              try {
                return originalDefine.call(Object, obj, prop, {
                  ...descriptor,
                  configurable: true
                });
              } catch (e) {
                try {
                  obj[prop] = descriptor.value;
                } catch (_) {}
                return obj;
              }
            }
            return originalDefine.apply(Object, arguments);
          };
        } catch (_) {}

        // Global uncaught error filter for third-party browser extensions
        window.addEventListener('error', function(e) {
          if (
            (e.filename && (
              e.filename.startsWith('chrome-extension://') ||
              e.filename.startsWith('moz-extension://') ||
              e.filename.includes('evmAsk.js')
            )) ||
            (e.message && (
              e.message.includes('Cannot redefine property: ethereum') ||
              e.message.includes('evmAsk')
            ))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
